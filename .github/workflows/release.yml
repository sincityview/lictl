name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  GOFLAGS: '-mod=mod'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          GONOSUMCHECK=* GONOSUMDB=* GOINSECURE=* GOPROXY=direct GOTOOLCHAIN=local \
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${SHORT_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o lictl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/lictl/
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lictl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lictl-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for f in artifacts/lictl-*/*; do
            cp "$f" release/
            chmod +x release/$(basename "$f")
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
