# Пример: Простая VM с cloud-init

provider:
  libvirt:
    uri: "qemu:///system"

resources:
  storage:
    - name: default
      type: dir
      path: /var/lib/libvirt/images
      autostart: true

  networks:
    - name: default
      mode: nat
      subnet: 192.168.122.0/24
      dhcp:
        start: 192.168.122.100
        end: 192.168.122.200

  vms:
    - name: web-server
      base_image: ubuntu-24.04-server-cloudimg-amd64.img
      storage_pool: default
      cpu: 2
      memory: 2048
      disk: 20Gi
      networks:
        - name: default
      cloud_init:
        hostname: web-server
        users:
          - name: admin
            ssh_authorized_keys:
              - ssh-ed25519 AAAA3... admin@workstation
            sudo: true
        packages:
          - nginx
          - curl
          - htop
        runcmd:
          - systemctl enable nginx
          - systemctl start nginx
          - echo "Server is ready!" > /home/admin/ready.txt
      autostart: true
