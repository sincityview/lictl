provider:
  libvirt:
    uri: qemu:///system

resources:
  storage:
    - name: cluster-pool
      type: dir
      path: /var/lib/libvirt/cluster-storage

  networks:
    - name: default
      mode: nat
      bridge: virbr0
      subnet: 192.168.122.0/24
      dhcp:
        start: 192.168.122.100
        end: 192.168.122.254

  vms:
    - name: kube-etcd-1
      memory: 2048
      cpu: 2
      storage: cluster-pool
      base_image: /var/lib/libvirt/images/debian-13-genericcloud-amd64.qcow2
      cloud_init:
        hostname: kube-etcd-1
        users:
          - name: deploy
            ssh_authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILcCJMKx0SJAbqnuvXfv+Ve5UP6x0G0STy/NfCwxbEMz apex@apexgroup
            sudo: true
            shell: /bin/bash
        packages:
          - qemu-guest-agent
        runcmd:
          - systemctl enable qemu-guest-agent
      autostart: true
